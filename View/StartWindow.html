<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start - Silnik Gier Paragrafowych</title>
    <link rel="stylesheet" href="MainWindow.generated.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
    </style>
</head>

<body class="m-0 h-screen w-screen bg-transparent text-[#fafafa] font-sans flex items-center justify-center selection:bg-zinc-800" style="-webkit-app-region: drag;">
    <div class="flex w-full max-w-4xl h-[550px] rounded-xl border border-zinc-800 bg-zinc-950 shadow-2xl overflow-hidden relative">
        <button id="btn-close-app" class="absolute top-4 right-4 text-zinc-500 hover:text-red-400 transition-colors z-50" aria-label="Zamknij aplikację" style="-webkit-app-region: no-drag;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
            <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-blue-900/10 blur-[100px]"></div>
        </div>

        <div class="relative flex w-1/2 flex-col p-10 border-r border-zinc-800 bg-zinc-950/80 z-10" style="-webkit-app-region: no-drag;">
            <div class="flex items-center gap-4 mb-12">
                <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-zinc-900 border border-zinc-700 text-[#58a6ff] text-2xl font-bold shadow-sm">
                    §
                </div>
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight text-zinc-50">SGP</h1>
                    <p class="text-sm text-zinc-400" data-i18n="start_window.app_subtitle">Silnik Gier Paragrafowych</p>
                </div>
            </div>

            <div class="flex-1">
                <h2 class="mb-5 text-xs font-semibold text-zinc-500 uppercase tracking-widest" data-i18n="start_window.get_started">Rozpocznij</h2>
                
                <div class="flex flex-col gap-3">
                    <button id="btn-create-project" class="inline-flex h-10 items-center justify-start rounded-md bg-zinc-50 px-4 text-sm font-medium text-zinc-900 transition-colors hover:bg-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:ring-offset-2 focus:ring-offset-zinc-950 w-full gap-3 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-700"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        <span data-i18n="start_window.create_project">Stwórz nowy projekt</span>
                    </button>

                    <button id="btn-open-project" class="inline-flex h-10 items-center justify-start rounded-md border border-zinc-800 bg-zinc-900 px-4 text-sm font-medium transition-colors hover:bg-zinc-800 hover:text-zinc-50 focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:ring-offset-2 focus:ring-offset-zinc-950 w-full gap-3 text-zinc-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-400"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
                        <span data-i18n="start_window.open_project">Otwórz projekt</span>
                    </button>
                </div>
            </div>

            <div class="mt-auto flex items-center justify-between text-xs text-zinc-500">
                <span data-i18n="start_window.version">Wersja</span><span id="app-version"> 1.0.0</span>
                <div class="relative">
                    <button id="btn-settings" class="hover:text-zinc-300 transition-colors" data-i18n="start_window.settings">Ustawienia</button>
                    <div id="settings-dropdown" class="hidden absolute bottom-7 right-0 w-40 rounded-lg border border-zinc-700 bg-zinc-900 shadow-xl overflow-hidden z-50">
                        <div class="px-3 py-2 border-b border-zinc-800">
                            <span class="text-[10px] font-semibold uppercase tracking-widest text-zinc-500" data-i18n="start_window.language">Język</span>
                        </div>
                        <button id="btn-lang-pl" class="flex items-center gap-2 w-full px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-zinc-50 transition-colors">
                            <span class="text-base">🇵🇱</span>
                            <span data-i18n="start_window.language_pl">Polski</span>
                        </button>
                        <button id="btn-lang-en" class="flex items-center gap-2 w-full px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-zinc-50 transition-colors">
                            <span class="text-base">🇬🇧</span>
                            <span data-i18n="start_window.language_en">English</span>
                        </button>
                        <button id="btn-lang-de" class="flex items-center gap-2 w-full px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-zinc-50 transition-colors">
                            <span class="text-base">🇩🇪</span>
                            <span data-i18n="start_window.language_de">Deutsch</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="relative flex w-1/2 flex-col p-10 bg-zinc-900/40 z-10">
            <h2 class="mb-5 text-xs font-semibold text-zinc-500 uppercase tracking-widest" data-i18n="start_window.recent_projects">Ostatnie projekty</h2>
            
            <div id="recent-projects-list" class="flex flex-col gap-2 overflow-y-auto pr-2 custom-scrollbar" style="-webkit-app-region: no-drag;">
                
            </div>
        </div>

    </div>
    
    <div id="new-project-modal" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm pointer-events-auto" style="-webkit-app-region: no-drag;">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 w-[420px] shadow-2xl flex flex-col gap-4">
            <div class="flex items-start justify-between">
                <h2 class="text-lg font-semibold text-zinc-100" data-i18n="start_window.new_project_title">Szczegóły nowego projektu</h2>
                <button id="btn-close-new-project-modal" class="ml-4 flex-shrink-0 text-zinc-500 hover:text-red-400 transition-colors" aria-label="Zamknij" style="-webkit-app-region: no-drag;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="np-nazwa" class="text-sm text-zinc-400" data-i18n="start_window.np_name">Nazwa projektu</label>
                <input type="text" id="np-nazwa" class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 placeholder-zinc-700" data-i18n-placeholder="start_window.np_name_placeholder" style="-webkit-app-region: no-drag;">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-sm text-zinc-400" data-i18n="start_window.np_folder">Folder projektu</label>
                <div class="flex gap-2 items-center">
                    <div id="np-folder-display" class="flex-1 min-w-0 bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-500 truncate select-none" data-i18n="start_window.np_folder_placeholder">Nie wybrano folderu...</div>
                    <button id="btn-browse-folder" class="flex-shrink-0 flex items-center gap-1.5 px-3 py-2 rounded border border-zinc-700 bg-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700 hover:text-zinc-100 transition-colors" style="-webkit-app-region: no-drag;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
                        <span data-i18n="start_window.np_browse">Przeglądaj</span>
                    </button>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-2">
                <button id="btn-cancel-new-project" class="px-4 py-2 rounded text-sm text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition-colors" style="-webkit-app-region: no-drag;" data-i18n="start_window.np_cancel">Anuluj</button>
                <button id="btn-submit-new-project" disabled class="px-4 py-2 rounded bg-zinc-50 text-zinc-900 text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed hover:enabled:bg-zinc-200" style="-webkit-app-region: no-drag;" data-i18n="start_window.np_create">Utwórz projekt</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="../dist/ViewModel/StartWindowViewModel.js"></script>
</body>
</html>
