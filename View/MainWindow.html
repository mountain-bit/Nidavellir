<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silnik Gier Paragrafowych</title>
    <link rel="stylesheet" href="MainWindow.generated.css">
    <script src="../node_modules/cytoscape/dist/cytoscape.min.js"></script>
</head>

<body class="m-0 min-w-[760px] overflow-hidden bg-[#1e1e1e] font-sans text-[#d4d4d4]">
    <div class="app-shell grid h-screen grid-cols-[260px_minmax(360px,1fr)_280px] grid-rows-[46px_minmax(0,1fr)] overflow-hidden">
        <header class="col-span-full flex items-center gap-7 border-b border-[#3c3c3c] bg-[#252526] px-4" aria-label="Pasek narzędzi">
            <div class="whitespace-nowrap font-semibold text-white"><span class="align-[-1px] text-[21px] text-[#58a6ff]">§</span> Silnik Gier Paragrafowych</div>
            <nav class="flex gap-1" aria-label="Narzędzia">
                <button class="rounded-sm border-0 bg-transparent px-2.5 py-1.5 hover:bg-[#3c3c3c]" type="button" data-action="new-file">Nowy plik</button>
                <button class="rounded-sm border-0 bg-transparent px-2.5 py-1.5 hover:bg-[#3c3c3c]" type="button" data-action="save">Zapisz</button>
                <button class="rounded-sm border-0 bg-transparent px-2.5 py-1.5 hover:bg-[#3c3c3c]" type="button" data-action="show-graph">Graf</button>
            </nav>
            <div class="ml-auto text-xs text-[#9da0a5]" id="save-status">Gotowy</div>
        </header>

        <aside class="min-w-0 overflow-hidden border-r border-[#3c3c3c] bg-[#252526]" id="left-sidebar" aria-label="Eksplorator projektu">
            <div class="flex h-[42px] items-center px-2.5 pl-4"><h2 class="m-0 text-[11px] font-bold tracking-[.08em] uppercase">Eksplorator</h2><button class="ml-auto border-0 bg-transparent text-2xl leading-[26px] text-[#b9b9b9] hover:text-white" type="button" data-toggle="left-sidebar" aria-label="Zwiń eksplorator">‹</button></div>
            <div class="p-2"><div class="p-2 text-xs font-semibold text-[#c8c8c8]">MOJA GRA</div><ul class="m-0 list-none p-0" aria-label="Pliki projektu">
                <li><button class="w-full border-0 bg-transparent px-2 py-[7px] text-left text-[13px] hover:bg-[#37373d] focus:bg-[#37373d] focus:outline-none" type="button" data-file="Wprowadzenie.md">▤ Wprowadzenie.md</button></li>
                <li><button class="w-full border-0 bg-transparent px-2 py-[7px] text-left text-[13px] hover:bg-[#37373d] focus:bg-[#37373d] focus:outline-none" type="button" data-file="Scena 1">◇ Scena 1</button></li>
                <li><button class="w-full border-0 bg-transparent px-2 py-[7px] text-left text-[13px] hover:bg-[#37373d] focus:bg-[#37373d] focus:outline-none" type="button" data-file="Scena 2">◇ Scena 2</button></li>
                <li><button class="w-full border-0 bg-transparent px-2 py-[7px] text-left text-[13px] hover:bg-[#37373d] focus:bg-[#37373d] focus:outline-none" type="button" data-file="Graf historii">⌘ Graf historii</button></li>
            </ul></div>
        </aside>

        <main class="flex min-w-0 flex-col bg-[#1e1e1e]" aria-label="Obszar roboczy">
            <div class="flex min-h-[38px] overflow-x-auto bg-[#252526]" id="editor-tabs" role="tablist" aria-label="Otwarte pliki"></div>
            <section class="flex min-h-0 flex-1 flex-col" id="text-editor" aria-label="Edytor pliku">
                <div class="flex justify-between border-b border-[#303030] px-[18px] py-2 text-xs text-[#9da0a5]"><span id="active-file-label"></span><span>UTF-8 · Markdown</span></div>
                <textarea class="min-h-0 flex-1 resize-none border-0 bg-[#1e1e1e] px-7 py-[22px] font-mono text-sm leading-[1.65] text-[#d4d4d4] outline-0" id="file-editor" spellcheck="false" aria-label="Zawartość pliku"></textarea>
            </section>
            <section class="min-h-0 flex-1 flex-col" id="graph-panel" aria-label="Graf historii" hidden>
                <div class="flex justify-between border-b border-[#303030] px-[18px] py-2 text-xs text-[#9da0a5]"><span>Graf historii</span><span>Przeciągaj węzły, aby uporządkować sceny</span></div>
                <div class="min-h-0 flex-1" id="story-graph"></div>
            </section>
        </main>

        <aside class="min-w-0 overflow-hidden border-l border-[#3c3c3c] bg-[#252526]" id="right-sidebar" aria-label="Właściwości">
            <div class="flex h-[42px] items-center px-2.5 pl-4"><h2 class="m-0 text-[11px] font-bold tracking-[.08em] uppercase">Właściwości</h2><button class="ml-auto border-0 bg-transparent text-2xl leading-[26px] text-[#b9b9b9] hover:text-white" type="button" data-toggle="right-sidebar" aria-label="Zwiń właściwości">›</button></div>
            <div class="px-4"><section class="border-b border-[#3c3c3c] py-[13px]"><h3 class="mb-2.5 text-xs font-semibold text-[#ccc]">Wybrany element</h3><p class="m-0 text-[13px] text-[#b9b9b9]" id="selected-element">Wprowadzenie.md</p></section>
                <section class="border-b border-[#3c3c3c] py-[13px]"><h3 class="mb-2.5 text-xs font-semibold text-[#ccc]">Informacje</h3><dl class="m-0 grid grid-cols-2 gap-[7px] text-[13px] text-[#b9b9b9]"><dt class="text-[#888]">Typ</dt><dd class="m-0" id="selected-type">Dokument</dd><dt class="text-[#888]">Status</dt><dd class="m-0">W edycji</dd></dl></section>
                <section class="border-b border-[#3c3c3c] py-[13px]"><h3 class="mb-2.5 text-xs font-semibold text-[#ccc]">Nawigator</h3><button class="w-full rounded-sm border-0 bg-[#37373d] px-2.5 py-1.5 text-left text-[13px] hover:bg-[#45454c]" type="button" data-action="show-graph">Pokaż graf historii</button></section>
            </div>
        </aside>

        <button class="fixed top-[54px] left-0 z-[2] border border-[#3c3c3c] bg-[#252526] px-2 py-1 text-[#b9b9b9]" type="button" data-toggle="left-sidebar" data-reopen="left-sidebar" aria-label="Rozwiń eksplorator" hidden>›</button>
        <button class="fixed top-[54px] right-0 z-[2] border border-[#3c3c3c] bg-[#252526] px-2 py-1 text-[#b9b9b9]" type="button" data-toggle="right-sidebar" data-reopen="right-sidebar" aria-label="Rozwiń właściwości" hidden>‹</button>
    </div>
    <script src="MainWindow.js"></script>
</body>

</html>
