<div class="paragraph-node-header">
    <span class="paragraph-node-title"></span>
    <button type="button" class="paragraph-node-socket" data-i18n-title="graph.node.socket_title" data-i18n-aria-label="graph.node.socket_aria_label">
        <span class="socket-inner-dot"></span>
    </button>
</div>
<div class="paragraph-node-body">
    <div class="paragraph-node-tags"></div>
    <div class="paragraph-node-separator hidden"></div>
    <div class="paragraph-node-summary hidden"></div>
</div>
<div class="paragraph-node-add-container">
    <button type="button" class="paragraph-node-add-btn" data-i18n-title="graph.node.add_btn_title" data-i18n-aria-label="graph.node.add_btn_aria_label">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 5v14m-7-7h14"></path>
        </svg>
    </button>
    <div class="paragraph-node-add-form">
        <input type="text" class="paragraph-node-add-input" data-i18n-placeholder="graph.node.add_input_placeholder" />
        <button type="button" class="paragraph-node-add-submit" data-i18n-title="graph.node.add_submit_title" data-i18n-aria-label="graph.node.add_submit_title">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
        </button>
    </div>
</div>
