<div class="paragraph-node-header">
    <span class="paragraph-node-title"></span>
    <button
        type="button"
        class="paragraph-node-socket"
        data-i18n-title="graph.node.socket_title"
        data-i18n-aria-label="graph.node.socket_aria_label"
    >
        <span class="socket-inner-dot"></span>
    </button>
</div>
<div class="paragraph-node-body">
    <div class="paragraph-node-tags"></div>
    <div class="paragraph-node-separator hidden"></div>
    <div class="paragraph-node-summary hidden"></div>
</div>
<div class="paragraph-node-add-container">
    <button
        type="button"
        class="paragraph-node-add-btn"
        data-i18n-title="graph.node.add_btn_title"
        data-i18n-aria-label="graph.node.add_btn_aria_label"
    >
        <app-icon name="plus" class="w-3.5 h-3.5"></app-icon>
    </button>
    <div class="paragraph-node-add-form">
        <input
            type="text"
            class="paragraph-node-add-input"
            data-i18n-placeholder="graph.node.add_input_placeholder"
        />
        <button
            type="button"
            class="paragraph-node-add-submit"
            data-i18n-title="graph.node.add_submit_title"
            data-i18n-aria-label="graph.node.add_submit_title"
        >
            <app-icon name="check" class="w-3 h-3"></app-icon>
        </button>
    </div>
</div>
