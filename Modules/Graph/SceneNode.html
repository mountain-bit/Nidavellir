<div class="scene-node-header" data-i18n-title="graph.scene.drag_hint">
    <app-icon name="scene" class="w-3.5 h-3.5 shrink-0 scene-icon"></app-icon>
    <span class="scene-node-title"></span>
    <span class="scene-node-badges flex items-center gap-1"></span>
    <span class="scene-node-count hidden"></span>
    <button
        type="button"
        class="scene-node-lock-btn"
        data-i18n-title="graph.scene.unlock_title"
        data-i18n-aria-label="graph.scene.unlock_title"
    >
        <span class="icon-lock-wrapper">
            <app-icon name="lock" class="w-3 h-3 icon-locked"></app-icon>
            <app-icon name="unlock" class="w-3 h-3 icon-unlocked hidden"></app-icon>
        </span>
    </button>
</div>
<div class="scene-node-body"></div>
<div class="scene-resize-handle handle-nw" data-handle="nw"></div>
<div class="scene-resize-handle handle-n" data-handle="n"></div>
<div class="scene-resize-handle handle-ne" data-handle="ne"></div>
<div class="scene-resize-handle handle-e" data-handle="e"></div>
<div class="scene-resize-handle handle-se" data-handle="se"></div>
<div class="scene-resize-handle handle-s" data-handle="s"></div>
<div class="scene-resize-handle handle-sw" data-handle="sw"></div>
<div class="scene-resize-handle handle-w" data-handle="w"></div>
