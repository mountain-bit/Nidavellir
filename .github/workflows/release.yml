name: Release Desktop Windows App

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.5
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check license compliance
        run: pnpm run license:check

      - name: Run unit tests
        run: pnpm run test:run

      - name: Build assets (Tailwind, TypeScript, esbuild)
        run: pnpm run build

      - name: Build Windows Installer (.exe)
        run: pnpm exec electron-builder --win --publish never

      - name: Read version from package.json
        id: package_version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "version=v$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.package_version.outputs.version }}
          name: Nidavelir ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.package_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-builds/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
