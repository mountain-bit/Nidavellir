name: Pull Request Verification

on:
  pull_request:
    branches:
      - main
      - release
      - dev
      - develop
  push:
    branches:
      - tests
      - main
      - release
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-lint:
    name: Lint, Build & Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.5

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check license compliance
        run: pnpm run license:check

      - name: Check code format (Prettier)
        run: pnpm run format:check

      - name: Lint code (ESLint)
        run: pnpm run lint

      - name: Build renderer & CSS
        run: pnpm run build

      - name: Run Unit & Component Tests (Vitest)
        run: pnpm run test:run

  e2e-tests:
    name: End-to-End Tests (Playwright Electron)
    needs: unit-and-lint
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.5

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm run build

      - name: Run E2E Tests (Playwright)
        run: pnpm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

